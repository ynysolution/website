{% extends "layout.html" %}
{% block content %}

<div>
    <h1 class="text-center merriweather-black-italic text-4xl md:text-6xl py-4">Our Projects so Far</h1>
    <div class="flex justify-center items-center flex-wrap flex-col md:flex-row my-8 px-4 gap-4">
		{% for project in projects %}
		<div class="max-w-sm bg-white border border-gray-200 rounded-lg shadow">
			<a href="#">
				<img class="rounded-t-lg object-cover w-full h-48" src="{{ url_for('static', filename=project.img) }}" alt="Service Image" />
			</a>
			<div class="p-5">
				<a href="#">
					<h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900">{{ project.name }}</h5>
				</a>
				<p class="mb-3 font-normal text-gray-700">{{ project.desc }}</p>
			</div>
		</div>
		{% endfor %}
	</div>
</div>

{% endblock content %}
